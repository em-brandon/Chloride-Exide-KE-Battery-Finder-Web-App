services:
  postgres:
    image: postgres:15
    container_name: battery-finder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batteryfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batteryfinder}
      POSTGRES_DB: ${POSTGRES_DB:-batteryfinderdev}
    ports:
      - "5432:5432"
    volumes:
      - battery_finder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batteryfinder} -d ${POSTGRES_DB:-batteryfinderdev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  battery_finder_pgdata:
