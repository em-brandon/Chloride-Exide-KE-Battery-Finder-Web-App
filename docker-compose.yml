services:
  postgres:
    image: postgres:15
    container_name: battery-finder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batteryfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batteryfinder}
      POSTGRES_DB: ${POSTGRES_DB:-batteryfinderdev}
    ports:
      # Published on 5434, not 5432: a native PostgreSQL install commonly
      # already owns 5432 on the host (IPv4), and Docker Desktop on Windows
      # would otherwise bind the container's mapping on IPv6 instead of
      # erroring — silently splitting "localhost:5432" across two different
      # Postgres instances depending on which address family a client picks.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - battery_finder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batteryfinder} -d ${POSTGRES_DB:-batteryfinderdev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  battery_finder_pgdata:
