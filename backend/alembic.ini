# Alembic configuration file.
# This file is read by `alembic` commands (migrate, upgrade, downgrade, etc.)

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# The connection URL is loaded from the environment in alembic/env.py
# so this line is intentionally left blank.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks needed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
